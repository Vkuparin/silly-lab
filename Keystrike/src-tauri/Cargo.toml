[package]
name = "keystrike"
version = "1.1.0"
description = "Portable Helsinki keyboard and mouse defense game"
edition = "2021"
license = "MIT"

[lib]
name = "keystrike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
